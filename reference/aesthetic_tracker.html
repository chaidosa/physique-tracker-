<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Form — 12 Week Physique Tracker</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf1f8;background:#0b111d;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #70c7d4;outline-offset:2px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:#101827;border-right:1px solid #243044;padding:26px 17px;position:sticky;top:0;height:100vh}.brand{font-weight:850;font-size:24px;letter-spacing:-1px;margin:1px 8px 7px}.brand span{color:#54dbbf}.sub{font-size:12px;color:#8a9bb0;margin:0 8px 35px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#9aacc0;text-align:left;padding:12px;border-radius:11px;font-weight:650}.nav button.active,.nav button:hover{background:#233449;color:#e7fffa}.nav button b{margin-right:9px}.sidebarfooter{position:absolute;bottom:20px;left:25px;right:25px;color:#8192a8;font-size:12px;line-height:1.5}.main{width:min(1200px,100%);margin:0 auto;padding:30px 38px 70px}h1{font-size:32px;letter-spacing:-1.2px;margin:3px 0 5px}h2{font-size:20px;margin:0 0 17px;letter-spacing:-.4px}h3{margin:0 0 10px;font-size:15px}.muted{color:#91a2b7}.small{font-size:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#59cdbd;font-weight:800}.top{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:25px}.datebox{border:1px solid #304158;border-radius:12px;padding:10px 13px;color:#dce9f5;background:#162234}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#141f30;border:1px solid #26354a;border-radius:17px;padding:20px}.metric label{display:block;color:#99abc1;font-size:12px;font-weight:650}.metric strong{font-size:28px;letter-spacing:-.8px;display:block;margin-top:9px}.metric p{font-size:12px;color:#7f95ad;margin:5px 0 0}.accent{color:#5ce1c5}.section{margin-top:25px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.pill{display:inline-block;background:#1b3a38;color:#75e4c9;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:750}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#19283b;border:1px solid #2d3e53;padding:12px 6px;text-align:center;border-radius:11px;color:#aabbd0}.day.active{border-color:#50c9b6;background:#193d3d;color:#e5fff9}.day strong{font-size:12px;display:block}.day span{font-size:11px}.btn{background:#51d1b6;border:1px solid #51d1b6;color:#071e20;border-radius:10px;padding:10px 14px;font-weight:800}.btn.secondary{background:#1d2c41;color:#dbe8f4;border-color:#3b5067}.btn.danger{background:#422933;border-color:#694453;color:#ffc4c4}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.smallbtn{font-size:12px;padding:7px 10px}input,select,textarea{background:#0e1828;color:#e9f2fa;border:1px solid #34455b;border-radius:9px;padding:10px 12px;max-width:100%}input[type=number]{width:95px}input[type=date]{color-scheme:dark}input[type=checkbox]{accent-color:#51d1b6;width:17px;height:17px}textarea{width:100%;min-height:80px}.fields{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field label{display:block;font-size:12px;color:#9eb1c6;margin-bottom:6px}.field input{width:130px}.exercise{border:1px solid #2b3c52;border-radius:12px;margin:12px 0;padding:15px;background:#101b2b}.exercise-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.exercise h3{font-size:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#8fa4b8;font-weight:600;font-size:12px;padding:10px 7px;border-bottom:1px solid #324257}td{padding:8px 7px;border-bottom:1px solid #243447}td input[type=number]{width:88px;padding:8px}td input[type=checkbox]{width:17px}td button{background:transparent;border:0;color:#ec909b;font-size:18px}.hint{color:#7e96ad;font-size:12px;line-height:1.55}.progress{height:9px;background:#29374a;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#55d6bb;border-radius:20px}.barline{display:flex;justify-content:space-between;font-size:12px;color:#9baec0;margin-bottom:7px}.chart{width:100%;height:220px;border-radius:12px;background:#101b2c;padding:10px}.empty{text-align:center;padding:40px 12px;color:#8299b2}.mobilehead{display:none}.toast{position:fixed;bottom:20px;right:22px;background:#55d6bb;color:#06211d;padding:10px 16px;border-radius:10px;font-weight:750;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.hide{display:none!important}.stattext{font-size:13px;color:#a4b7ca;line-height:1.7}.linkbtn{color:#71d6c7;background:none;border:none;padding:4px;font-weight:700}.mealrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #28394e;padding:12px 0;gap:10px}.mealrow:last-child{border:0}.preset{margin:5px 5px 0 0}.meter{margin:13px 0}.help{border-left:3px solid #52cdb9;padding-left:12px;color:#aec3d2;font-size:13px;line-height:1.7}.setting-row{margin:12px 0}.setting-row label{display:inline-block;min-width:160px;color:#aab9cc}.setting-row input{width:140px}.danger-zone{border:1px solid #6b3b4b}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:700px){.layout{display:block}.sidebar{position:sticky;top:0;height:auto;z-index:10;padding:8px 12px;border-bottom:1px solid #2a394c}.brand,.sub,.sidebarfooter{display:none}.nav{flex-direction:row;overflow:auto;gap:3px}.nav button{font-size:12px;padding:10px;white-space:nowrap}.nav button b{display:none}.main{padding:24px 14px 80px}.top{align-items:center}h1{font-size:26px}.days{gap:4px}.day{padding:9px 2px}.day span{font-size:10px}.card{padding:14px}.grid3{grid-template-columns:1fr 1fr}.datebox{font-size:12p </style></head><body><div class="layout"><aside class="sidebar"><div class="brand">FORM<span>.</span></div><div class="sub">Your 12-week transformation</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><b>◫</b> Overview</button><button data-page="workout"><b>▤</b> Workout log</button><button data-page="nutrition"><b>◉</b> Nutrition</button><button data-page="progress"><b>⌁</b> Progress</button><button data-page="settings"><b>⚙</b> Settings</button></nav><div class="sidebarfooter">Offline-first • Stored on this device<br>Export backups in Settings</div></aside><main class="main"><div id="content"></div></main></div><div class="toast" id="toast">Saved</div>
<script>
(()=>{'use strict';
const EX=[
{day:'Push',dow:1,focus:'Chest, shoulders, triceps',moves:[['Incline dumbbell bench press',3,'8–12'],['Machine chest press',2,'8–12'],['Seated shoulder press',2,'8–12'],['Cable lateral raise',3,'12–20'],['Rope triceps pushdown',2,'10–15'],['Overhead cable triceps extension',2,'10–15']]},
{day:'Pull',dow:2,focus:'Back width, thickness, biceps',moves:[['Lat pulldown',3,'8–12'],['Chest-supported row',3,'8–12'],['One-arm cable lat pulldown',2,'10–15'],['Reverse pec deck',2,'12–20'],['EZ-bar curl',2,'10–15'],['Hammer curl',2,'10–15']]},
{day:'Legs',dow:3,focus:'Quads, hamstrings, calves',moves:[['Hack squat or goblet squat',3,'8–12'],['Romanian deadlift',2,'8–10'],['Leg press',2,'10–15'],['Seated leg curl',2,'10–15'],['Standing calf raise',3,'10–15']]},
{day:'Upper',dow:5,focus:'Chest, back, shoulder width, arms',moves:[['Incline machine press',3,'8–12'],['Assisted pull-up or lat pulldown',2,'8–12'],['Seated cable row',2,'8–12'],['Cable chest fly',2,'12–15'],['Dumbbell lateral raise',3,'12–20'],['Reverse pec deck',2,'12–20'],['Preacher curl',2,'10–15'],['Cable triceps pushdown',2,'10–15']]},
{day:'Lower + Abs',dow:6,focus:'Lower body, core',moves:[['Leg press or squat',3,'8–12'],['Hip thrust',2,'8–12'],['Lying leg curl',3,'10–15'],['Leg extension',2,'12–15'],['Seated calf raise',3,'10–20'],['Cable crunch',3,'10–15'],['Hanging knee raise',2,'10–15']]}];
const START='2026-10-12';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const dateFrom=s=>new Date(s+'T12:00:00');const nice=s=>dateFrom(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});const today=iso(new Date());
const defaults=()=>({version:1,start:START,targets:{calories:2350,protein:160,carbs:270,fat:70,steps:6000},profile:{age:30,height:174,startingWeight:79},workouts:{},nutrition:{},measurements:{},habits:{}});let db;try{db=JSON.parse(localStorage.getItem('formTrackerV1'))||defaults()}catch(e){db=defaults()}db={...defaults(),...db,targets:{...defaults().targets,...db.targets}};let state={page:'dashboard',date:today,workoutDay:null};const save=()=>{try{localStorage.setItem('formTrackerV1',JSON.stringify(db))}catch(e){alert('Browser storage is unavailable. Export your data to avoid loss.')}toast()};let toastTimer;function toast(){const el=$('#toast');el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1100)};const nav=page=>{state.page=page;render()};document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
const week=()=>Math.max(1,Math.min(12,Math.floor((dateFrom(state.date)-dateFrom(db.start))/86400000/7)+1));const sessionFor=date=>EX.find(x=>x.dow===dateFrom(date).getDay());const defSession=date=>({day:sessionFor(date)?.day||'Push',exercises:{},notes:''});const getSession=date=>db.workouts[date]||defSession(date);const getNutrition=date=>db.nutrition[date]||{foods:[],steps:0};const sums=entry=>(entry?.foods||[]).reduce((a,x)=>(a.calories+=+x.calories||0,a.protein+=+x.protein||0,a.carbs+=+x.carbs||0,a.fat+=+x.fat||0,a),{calories:0,protein:0,carbs:0,fat:0});const allDates=()=>Object.keys(db.measurements).sort();function head(title,desc){return `<div class="top"><div><div class="eyebrow">12-week physique program · Week ${week()} of 12</div><h1>${title}</h1><div class="muted small">${desc}</div></div><input aria-label="Selected date" type="date" id="globalDate" value="${state.date}"></div>`}function metric(label,value,sub){return `<div class="card metric"><label>${label}</label><strong>${value}</strong><p>${sub}</p></div>`}function progress(label,current,target,unit=''){return `<div class="meter"><div class="barline"><span>${label}</span><span>${Math.round(current)} / ${target}${unit}</span></div><div class="progress"><div style="width:${Math.min(100,(current/target||0)*100)}%"></div></div></div>`}function safeNum(v){return Number.isFinite(+v)?Math.max(0,+v):0}
function dashboard(){let n=sums(getNutrition(state.date)),m=db.measurements[state.date]||{},session=getSession(state.date);const prescribed=sessionFor(state.date);let done=Object.values(session.exercises||{}).flat().filter(x=>x.done).length;return head('Your overview','Track workouts, nutrition, and body changes day by day')+`<div class="grid">${metric('Daily calories',`${Math.round(n.calories)} <span class="small muted">/ ${db.targets.calories}</span>`,'kcal consumed')}${metric('Protein',`${Math.round(n.protein)} <span class="small muted">/ ${db.targets.protein} g</span>`,'daily muscle-building target')}${metric('Body weight',m.weight?m.weight+' kg':'—','log today in Progress')}${metric('Workout sets',done,session.day+' · completed today')}</div><div class="section card"><div class="row"><h2>This week</h2><span class="pill">5-day split</span></div><div class="days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>{const dow=i===6?0:i+1;const x=EX.find(y=>y.dow===dow);return `<div class="day ${dateFrom(state.date).getDay()===dow?'active':''}"><strong>${d}</strong><span>${x?esc(x.day):'Rest'}</span></div>`}).join('')}</div></div><div class="split section"><div class="card"><div class="row"><h2>Today's training</h2><span class="pill">${esc(prescribed?.day||'Recovery')}</span></div>${prescribed?`<p class="stattext">${esc(prescribed.focus)}. ${prescribed.moves.length} exercises scheduled.</p><button class="btn" data-action="go" data-page="workout">Open workout log →</button>`:'<p class="stattext">Rest day. A walk and good sleep support recovery.</p><button class="btn secondary" data-action="go" data-page="workout">Log an optional workout</button>'}<div class="hint" style="margin-top:14px">Start with 2–3 reps in reserve. Prioritize technique, then gradually add reps or load.</div></div><div class="card"><div class="row"><h2>Macro progress</h2><button class="linkbtn" data-action="go" data-page="nutrition">Add food →</button></div>${progress('Calories',n.calories,db.targets.calories)}${progress('Protein',n.protein,db.targets.protein,'g')}${progress('Carbs',n.carbs,db.targets.carbs,'g')}${progress('Fat',n.fat,db.targets.fat,'g')}</div></div><div class="card section"><h2>Your 12-week checkpoints</h2><div class="grid3">${[['Weeks 1–3','Technique + consistency'],['Weeks 4–6','Progressive overload'],['Weeks 7–9','Build momentum'],['Weeks 10–11','Strength milestones'],['Week 12','Review and deload']].map(x=>`<div><div class="accent small">${x[0]}</div><div class="stattext">${x[1]}</div></div>`).join('')}</div></div>`}
function workout(){let scheduled=sessionFor(state.date),s=getSession(state.date),day=state.workoutDay||s.day;if(!EX.some(x=>x.day===day))day=scheduled?.day||'Push';let plan=EX.find(x=>x.day===day),log=s.day===day?s.exercises:{};let html=head('Workout log','Log each set, weight, reps, and completion')+`<div class="card"><div class="fields"><div class="field"><label>Training session</label><select id="sessionSelect">${EX.map(x=>`<option ${x.day===day?'selected':''}>${esc(x.day)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" id="workoutDate" value="${state.date}"></div><div class="field"><label>Prescription</label><div class="pill">${esc(plan.focus)}</div></div></div><p class="hint">Reps and weight are editable per set. Weight is in kg; for dumbbell movements, record the weight of one dumbbell consistently. Check a set when completed. The log saves automatically.</p></div>`;for(const [i,m] of plan.moves.entries()){const key=String(i),arr=log[key]||Array.from({length:m[1]},()=>({weight:'',reps:'',done:false}));html+=`<div class="exercise"><div class="exercise-head"><div><h3>${esc(m[0])}</h3><div class="hint">${m[1]} sets · ${m[2]} reps</div></div><button class="btn secondary smallbtn" data-action="addset" data-index="${i}" data-day="${esc(day)}">+ Set</button></div><div class="tablewrap"><table><thead><tr><th>Set</th><th>Weight (kg)</th><th>Reps</th><th>Done</th><th></th></tr></thead><tbody>${arr.map((v,j)=>`<tr><td>${j+1}</td><td><input aria-label="${esc(m[0])} set ${j+1} weight" type="number" step="0.5" min="0" data-ex="${i}" data-set="${j}" data-field="weight" value="${esc(v.weight)}"></td><td><input aria-label="${esc(m[0])} set ${j+1} repetitions" type="number" step="1" min="0" data-ex="${i}" data-set="${j}" data-field="reps" value="${esc(v.reps)}"></td><td><input aria-label="${esc(m[0])} set ${j+1} done" type="checkbox" data-ex="${i}" data-set="${j}" data-field="done" ${v.done?'checked':''}></td><td><button aria-label="Remove set" data-action="removeset" data-index="${i}" data-set="${j}" data-day="${esc(day)}">×</button></td></tr>`).join('')}</tbody></table></div></div>`}return html+`<div class="card section"><h3>Session notes</h3><textarea id="workoutNotes" placeholder="How did it feel? Energy, technique cues, personal records...">${esc(s.day===day?s.notes:'')}</textarea><p class="hint">Your entries stay on this device. Export a backup regularly from Settings.</p></div>`}
function nutrition(){let n=getNutrition(state.date),sum=sums(n),t=db.targets;return head('Nutrition log','Track your 2,350 kcal recomposition starting plan')+`<div class="grid">${metric('Calories',Math.round(sum.calories),`of ${t.calories} kcal`)}${metric('Protein',Math.round(sum.protein)+' g',`of ${t.protein} g`)}${metric('Carbs',Math.round(sum.carbs)+' g',`of ${t.carbs} g`)}${metric('Fat',Math.round(sum.fat)+' g',`of ${t.fat} g`)}</div><div class="split section"><div class="card"><h2>Add a meal or food</h2><form id="foodForm"><div class="field"><label>Food / meal</label><input id="foodName" required placeholder="e.g. Lunch: chicken and rice" style="width:100%;margin-bottom:12px"></div><div class="grid3"><div class="field"><label>Calories</label><input id="foodCalories" required type="number" min="0" step="1"></div><div class="field"><label>Protein (g)</label><input id="foodProtein" required type="number" min="0" step="0.1"></div><div class="field"><label>Carbs (g)</label><input id="foodCarbs" required type="number" min="0" step="0.1"></div><div class="field"><label>Fat (g)</label><input id="foodFat" required type="number" min="0" step="0.1"></div></div><div style="margin-top:16px"><button class="btn" type="submit">+ Add food</button></div></form><p class="hint">Use nutrition labels or a food database to determine portions and values. Sample meals are not automatically estimated.</p></div><div class="card"><h2>Daily intake</h2>${progress('Calories',sum.calories,t.calories)}${progress('Protein',sum.protein,t.protein,'g')}${progress('Carbohydrates',sum.carbs,t.carbs,'g')}${progress('Fat',sum.fat,t.fat,'g')}<div class="field section"><label>Steps today</label><input id="stepInput" type="number" min="0" step="1" value="${esc(n.steps??0)}"> <span class="small muted">Goal ${t.steps.toLocaleString()}</span></div></div></div><div class="card section"><h2>Foods logged</h2>${n.foods.length?n.foods.map((f,i)=>`<div class="mealrow"><div><strong>${esc(f.name)}</strong><div class="hint">${Math.round(f.calories)} kcal · P ${f.protein} g · C ${f.carbs} g · F ${f.fat} g</div></div><button class="btn secondary smallbtn" data-action="removefood" data-index="${i}">Remove</button></div>`).join(''):'<div class="empty">No food logged for this date yet.</div>'}</div>`}
function drawChart(points,key,label){let pts=points.filter(x=>Number.isFinite(Number(x[1]?.[key]))&&x[1]?.[key]!==''&&x[1]?.[key]!=null).map(x=>[x[0],+x[1][key]]);if(!pts.length)return `<div class="empty">No ${label.toLowerCase()} data yet. Add measurements below.</div>`;const w=700,h=180,p=32,values=pts.map(x=>x[1]);let min=Math.min(...values),max=Math.max(...values);if(min===max){min-=1;max+=1}const coords=pts.map((x,i)=>[p+(w-2*p)*(pts.length===1?.5:i/(pts.length-1)),h-p-(x[1]-min)/(max-min)*(h-2*p)]);const path=coords.map((x,i)=>(i?'L':'M')+x.join(' ')).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} trend"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#41546b"/><line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}" stroke="#41546b"/><text x="5" y="${p+4}" fill="#a0b1c8" font-size="12">${max.toFixed(1)}</text><text x="5" y="${h-p}" fill="#a0b1c8" font-size="12">${min.toFixed(1)}</text><path d="${path}" fill="none" stroke="#59d6be" stroke-width="3" stroke-linecap="round"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#59d6be"/>`).join('')}<text x="${p}" y="${h-4}" fill="#a0b1c8" font-size="12">${esc(pts[0][0])}</text><text x="${w-p}" y="${h-4}" text-anchor="end" fill="#a0b1c8" font-size="12">${esc(pts.at(-1)[0])}</text></svg>`}
function progressPage(){const m=db.measurements[state.date]||{},pts=allDates().map(k=>[k,db.measurements[k]]);return head('Body progress','Track weight and measurements consistently, ideally in the morning')+`<div class="split"><div class="card"><h2>Body-weight trend</h2>${drawChart(pts,'weight','Body weight (kg)')}</div><div class="card"><h2>Waist trend</h2>${drawChart(pts,'waist','Waist (cm)')}</div></div><div class="card section"><h2>Measurements for ${nice(state.date)}</h2><div class="fields">${[['weight','Body weight (kg)'],['waist','Waist (cm)'],['chest','Chest (cm)'],['arm','Upper arm (cm)'],['hips','Hips (cm)']].map(([key,label])=>`<div class="field"><label>${label}</label><input type="number" min="0" step="0.1" data-measure="${key}" value="${esc(m[key]??'')}"></div>`).join('')}</div><p class="hint">Initial weight: 79 kg. For waist, chest and arm circumference, measure in the same location and conditions each time.</p></div><div class="card section"><h2>12-week checkpoints</h2><table><thead><tr><th>Checkpoint</th><th>Goal</th></tr></thead><tbody><tr><td>Weeks 1–3</td><td>Establish form, routines, initial measurements</td></tr><tr><td>Weeks 4–6</td><td>More reps or modest load increases</td></tr><tr><td>Weeks 7–9</td><td>Stable or reducing waist with better lifts</td></tr><tr><td>Weeks 10–11</td><td>Consolidate improvements, manage fatigue</td></tr><tr><td>Week 12</td><td>Compare photos and strength; deload if needed</td></tr></tbody></table></div>`}
function settings(){return head('Settings & data','Your plan, your targets, your backup')+`<div class="card"><h2>Daily targets</h2>${[['calories','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)'],['steps','Daily steps']].map(([key,label])=>`<div class="setting-row"><label>${label}</label><input type="number" min="0" step="1" data-target="${key}" value="${db.targets[key]}"></div>`).join('')}<p class="hint">Initial recommendation: 2,350 kcal, 160 g protein, 270 g carbs, 70 g fat. Reassess after 2–3 weeks using weight averages, waist, recovery, and strength.</p><div class="setting-row"><label>Program start</label><input type="date" id="startDate" value="${db.start}"></div></div><div class="card section"><h2>Back up your progress</h2><p class="stattext">Everything saves automatically in this browser using local storage. Data will not synchronize between devices and could be erased if browser storage is cleared. Export a JSON backup regularly.</p><div class="fields"><button class="btn" data-action="export">Export backup (.json)</button><button class="btn secondary" data-action="csv">Export training (.csv)</button><label class="btn secondary" style="cursor:pointer">Import backup (.json)<input type="file" id="importFile" accept="application/json,.json" hidden></label></div></div><div class="card section danger-zone"><h2>Reset data</h2><p class="hint">Permanently removes logged sessions, food, measurements and custom settings from this browser.</p><button class="btn danger" data-action="reset">Delete all local data</button></div>`}
function render(){let el=$('#content');el.innerHTML=({dashboard,workout,nutrition,progress:progressPage,settings})[state.page]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#globalDate')?.addEventListener('change',e=>{state.date=e.target.value||today;state.workoutDay=null;render()});$('#workoutDate')?.addEventListener('change',e=>{state.date=e.target.value||today;state.workoutDay=null;render()});$('#sessionSelect')?.addEventListener('change',e=>{state.workoutDay=e.target.value;const s=db.workouts[state.date]||defSession(state.date);s.day=e.target.value;s.exercises=s.exercises||{};db.workouts[state.date]=s;save();render()});$('#workoutNotes')?.addEventListener('input',e=>{let s=ensureSession();s.notes=e.target.value;save()});$('#foodForm')?.addEventListener('submit',e=>{e.preventDefault();const food={name:$('#foodName').value.trim(),calories:safeNum($('#foodCalories').value),protein:safeNum($('#foodProtein').value),carbs:safeNum($('#foodCarbs').value),fat:safeNum($('#foodFat').value)};if(!food.name)return;ensureNutrition().foods.push(food);save();render()});$('#stepInput')?.addEventListener('change',e=>{ensureNutrition().steps=safeNum(e.target.value);save()});$('#startDate')?.addEventListener('change',e=>{if(e.target.value){db.start=e.target.value;save();render()}});$('#importFile')?.addEventListener('change',importFile)}function ensureSession(){if(!db.workouts[state.date])db.workouts[state.date]=defSession(state.date);const s=db.workouts[state.date];if(state.workoutDay)s.day=state.workoutDay;return s}function ensureNutrition(){return db.nutrition[state.date]??(db.nutrition[state.date]={foods:[],steps:0})}function ensureSets(i,day){const s=ensureSession();s.day=day;s.exercises??={};if(!s.exercises[i]){const plan=EX.find(x=>x.day===day);s.exercises[i]=Array.from({length:plan.moves[i][1]},()=>({weight:'',reps:'',done:false}))}return s.exercises[i]}
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-ex][data-set][data-field]')){let a=ensureSets(t.dataset.ex,state.workoutDay||getSession(state.date).day),obj=a[+t.dataset.set];obj[t.dataset.field]=t.dataset.field==='done'?t.checked:t.value;save();if(t.dataset.field==='done')render()}else if(t.matches('[data-measure]')){let v=t.value.trim();db.measurements[state.date]??={};if(v==='')delete db.measurements[state.date][t.dataset.measure];else db.measurements[state.date][t.dataset.measure]=safeNum(v);save();render()}else if(t.matches('[data-target]')){db.targets[t.dataset.target]=safeNum(t.value);save();render()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='go')nav(b.dataset.page);else if(a==='addset'){ensureSets(b.dataset.index,b.dataset.day).push({weight:'',reps:'',done:false});save();render()}else if(a==='removeset'){ensureSets(b.dataset.index,b.dataset.day).splice(+b.dataset.set,1);save();render()}else if(a==='removefood'){ensureNutrition().foods.splice(+b.dataset.index,1);save();render()}else if(a==='export')download('form-tracker-backup.json',JSON.stringify(db,null,2),'application/json');else if(a==='csv')csvExport();else if(a==='reset'){if(confirm('Delete ALL local tracker data? This cannot be undone without a backup.')){db=defaults();state.workoutDay=null;save();render()}}});
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function csvExport(){let rows=[['Date','Workout','Exercise','Set','Weight kg','Reps','Done','Session notes']];for(const [date,s] of Object.entries(db.workouts).sort()){let plan=EX.find(x=>x.day===s.day);if(!plan)continue;for(const [i,sets] of Object.entries(s.exercises||{})){for(let j=0;j<sets.length;j++){let z=sets[j];rows.push([date,s.day,plan.moves[+i]?.[0]||'',j+1,z.weight,z.reps,z.done?'Yes':'No',s.notes||''])}}}download('form-workout-log.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}async function importFile(e){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data!=='object'||!data.workouts||!data.nutrition||!data.measurements||!data.targets)throw Error('Invalid tracker backup');if(!confirm('Replace all current tracker data with this backup?'))return;db={...defaults(),...data,targets:{...defaults().targets,...data.targets}};state.workoutDay=null;save();render()}catch(err){alert('Could not import: '+err.message)}}render();
})();
</script></body></html>
